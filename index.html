<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SILVO TV - Il Televisore di Silvio</title>
  <meta name="description" content="SILVO TV: Il televisore con i 30 video più iconici di Silvio Berlusconi in autoplay continuo da 15 secondi con audio. Si va solo avanti!">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%200%22%20100%22%20100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>">
</head>
<body>

  <!-- Sfondo minimale scuro -->
  <div class="ambient-glow" id="ambient-glow"></div>

  <main class="tv-wrapper">

    <!-- Televisore -->
    <div class="retro-tv" id="retro-tv">
      
      <!-- Antenne retro -->
      <div class="tv-antenna" aria-hidden="true">
        <span class="ant ant-l"></span>
        <span class="ant ant-r"></span>
      </div>

      <!-- Cornice Schermo -->
      <div class="tv-bezel">
        <div class="tv-screen" id="tv-screen">
          
          <!-- YouTube Video Player -->
          <div class="player-container">
            <div id="yt-player"></div>
          </div>

          <!-- Effetto Scanline leggero -->
          <div class="scanlines" aria-hidden="true"></div>

          <!-- Effetto Scarica Canale -->
          <canvas class="static-canvas" id="static-canvas" width="320" height="240" aria-hidden="true"></canvas>

          <!-- Banner Sblocco Audio (se bloccato da policy browser) -->
          <div class="audio-unmute-overlay" id="audio-overlay">
            <button class="btn-unmute" id="btn-unmute" type="button">
              🔊 CLICCA PER ATTIVARE L'AUDIO
            </button>
          </div>

          <!-- OSD minimale sopra al video: Canale & Countdown 15s -->
          <div class="screen-osd">
            <div class="osd-pill" id="osd-badge">SILVO TV • C05</div>
            <div class="osd-timer-pill">
              <span id="osd-seconds">15s</span>
              <div class="osd-bar"><div class="osd-fill" id="osd-fill"></div></div>
            </div>
          </div>

          <!-- Allarme se tenta di andare indietro -->
          <div class="alert-solo-avanti" id="alert-solo-avanti">
            ⛔ MI CONSENTA! SI VA SOLO AVANTI!
          </div>

        </div>
      </div>

      <!-- Barra di controllo integrata nella TV -->
      <div class="tv-control-bar">
        
        <!-- Info Titolo Video in riproduzione -->
        <div class="tv-info">
          <div class="video-title" id="video-title">Caricamento Silvio...</div>
          <div class="video-meta" id="video-meta">Clip 01/30 • 1994</div>
        </div>

        <!-- Tasto Freccia AVANTI (SOLO AVANTI) -->
        <div class="tv-actions">
          <button class="btn-arrow-next" id="btn-next" type="button" title="Prossimo Video (Solo Avanti)">
            <span>AVANTI</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>

      </div>

    </div>

    <!-- Crediti puliti sotto al televisore -->
    <footer class="credits-bar">
      <p class="credits-main">
        <strong>SILVO TV</strong> • 30 clip storiche randomizzate • 15 secondi per video • Autoplay continuo con audio
      </p>
      <p class="credits-sub">
        Regola di rete: Si va solo avanti! Premi <kbd>SPAZIO</kbd> o <kbd>→</kbd> per cambiare canale.
      </p>
    </footer>

  </main>

  <!-- Script universali -->
  <script src="videos.js"></script>
  <script src="app.js"></script>
</body>
</html>
